name: redis-cache-webhits

include:
   - path: ./infra.yaml
services:
  web:
    build: .
    ports:
      - "${APP_PORT}:5000"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /code
        - action: rebuild
          path: requirements.txt
    post_start:
      - command: python -c "import redis,os; r=redis.Redis(host='redis'); r.ping(); print(f'Redis OK - User {os.getenv(\"user\")}')"
        environment:
          - user=boo-foxy
    pre_stop:
      - command: /bin/sh -c "echo 'Shutting down ${user}'; sleep 2"